<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <form id="LoginForm">
        <label for="username">Username</label>
        <br>
        <input type="text" name="username" id="username">
        <br>
        <span id="loginError" class="error"></span>
        <br>
        <label for="password">Password</label>
        <br>
        <input type="password" name="password" id="password">
        <br>
        <span id="passwordError" class="error"></span>
        <br><br>
        <input type="submit" value="Submit">
    </form>

    <script>
        document.getElementById("LoginForm").addEventListener("submit", function(event){

            let isValid = true;

            const loginName = document.getElementById("username").value;
            const loginError = document.getElementById("loginError");

            const loginRegex = /^[a-zA-Z0-9_]+$/;

            if(loginName.length === 0){
                isValid = false;
                loginError.textContent = "Username is required";
            }
            else if(!loginRegex.test(loginName)){
                isValid = false;
                loginError.textContent = "Username can contain only alphanumeric characters and underscore";
            }
            else if(loginName.length > 10){
                isValid = false;
                loginError.textContent = "Username cannot exceed 10 characters";
            }
            else{
                loginError.textContent = "";
            }

            const password = document.getElementById("password").value;
            const passwordError = document.getElementById("passwordError");

            const passwordRegex = /^(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{6,10}$/;

            if(password.length === 0){
                isValid = false;
                passwordError.textContent = "Password is required";
            }
            else if(!passwordRegex.test(password)){
                isValid = false;
                passwordError.textContent = "Password must have 6 to 10 characters containing at least one digit and one uppercase letter";
            }
            else{
                passwordError.textContent = "";
            }

            if(!isValid){
                event.preventDefault();
            }

        })
    </script>
</body>
</html>
