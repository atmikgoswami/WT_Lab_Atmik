<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure using SVG</title>
</head>
<body>
    <h2>Using SVG</h2>
    <svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="blue" stroke-width="1">
            <ellipse cx="200" cy="200" rx="100" ry="35"/>

            <ellipse cx="200" cy="200" rx="100" ry="35" transform="rotate(60 200 200)"/>
            <ellipse cx="200" cy="200" rx="100" ry="35" transform="rotate(120 200 200)"/>
        </g>
    </svg>
</body>
</html>
