<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-time Stock Prices</title>
</head>
<body>
    <h1>Real-time Stock Prices</h1>
    <p>AAPL: <span id="aapl">Loading...</span></p>
    <p>GOOG: <span id="goog">Loading...</span></p>

    <script>
        const eventSource = new EventSource("/WT_Lab_Atmik/WT_Lab_Atmik/q18/stocks");

        eventSource.addEventListener("AAPL", function(event) {
            document.getElementById("aapl").innerText = "$" + event.data;
        });

        eventSource.addEventListener("GOOG", function(event) {
            document.getElementById("goog").innerText = "$" + event.data;
        });

        eventSource.onerror = function() {
            console.error("EventSource failed.");
            eventSource.close();
        };
    </script>
</body>
</html>
