<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>States and Districts of India</title>
    <script>

        const statesAndDistricts = {
            "Andhra Pradesh": ["Anantapur", "Chittoor", "East Godavari", "Guntur", "Kadapa", "Krishna"],
            "Arunachal Pradesh": ["Itanagar", "Tawang", "Ziro", "Roing", "Pasighat"],
            "Assam": ["Guwahati", "Dibrugarh", "Jorhat", "Silchar", "Tezpur"],
            "Bihar": ["Patna", "Gaya", "Bhagalpur", "Muzaffarpur", "Darbhanga"],
            "Chhattisgarh": ["Raipur", "Bilaspur", "Durg", "Korba", "Jagdalpur"],
            "Goa": ["North Goa", "South Goa"],
            "Gujarat": ["Ahmedabad", "Surat", "Vadodara", "Rajkot", "Bhavnagar"],
            "Haryana": ["Gurugram", "Faridabad", "Panipat", "Ambala", "Rohtak"],
            "Himachal Pradesh": ["Shimla", "Manali", "Dharamshala", "Kullu", "Mandi"],
            "Jharkhand": ["Ranchi", "Dhanbad", "Jamshedpur", "Bokaro", "Deoghar"],
            "Karnataka": ["Bengaluru", "Mysuru", "Mangaluru", "Hubballi", "Belagavi"],
            "Kerala": ["Thiruvananthapuram", "Kochi", "Kozhikode", "Kollam", "Alappuzha"],
            "Madhya Pradesh": ["Bhopal", "Indore", "Gwalior", "Jabalpur", "Ujjain"],
            "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Thane", "Nashik"],
            "Manipur": ["Imphal", "Thoubal", "Bishnupur", "Churachandpur", "Ukhrul"],
            "Meghalaya": ["Shillong", "Tura", "Nongpoh", "Jowai", "Cherrapunji"],
            "Mizoram": ["Aizawl", "Lunglei", "Champhai", "Saiha", "Kolasib"],
            "Nagaland": ["Kohima", "Dimapur", "Mokokchung", "Tuensang", "Mon"],
            "Odisha": ["Bhubaneswar", "Cuttack", "Rourkela", "Puri", "Berhampur"],
            "Punjab": ["Amritsar", "Ludhiana", "Jalandhar", "Patiala", "Bathinda"],
            "Rajasthan": ["Jaipur", "Udaipur", "Jodhpur", "Ajmer", "Kota"],
            "Sikkim": ["Gangtok", "Gyalshing", "Namchi", "Mangan"],
            "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Tiruchirappalli", "Salem"],
            "Telangana": ["Hyderabad", "Warangal", "Nizamabad", "Khammam", "Karimnagar"],
            "Tripura": ["Agartala", "Dharmanagar", "Udaipur", "Kailashahar"],
            "Uttar Pradesh": ["Lucknow", "Kanpur", "Varanasi", "Agra", "Allahabad"],
            "Uttarakhand": ["Dehradun", "Haridwar", "Nainital", "Almora", "Rishikesh"],
            "West Bengal": ["Kolkata", "Darjeeling", "Siliguri", "Asansol", "Durgapur"]
        };

        function populateStates() {
            const stateSelect = document.getElementById("state");
            for (let state in statesAndDistricts) {
                const option = document.createElement("option");
                option.value = state;
                option.textContent = state;
                stateSelect.appendChild(option);
            }
        }

        function populateDistricts() {
            const stateSelect = document.getElementById("state");
            const districtSelect = document.getElementById("district");
            const selectedState = stateSelect.value;

            districtSelect.innerHTML = '<option value="">Select District</option>';

            if (selectedState && statesAndDistricts[selectedState]) {
                statesAndDistricts[selectedState].forEach(district => {
                    const option = document.createElement("option");
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
            }

            document.getElementById("selectedInfo").textContent = "";
        }

        function displaySelection() {
            const stateSelect = document.getElementById("state");
            const districtSelect = document.getElementById("district");
            const selectedState = stateSelect.value;
            const selectedDistrict = districtSelect.value;

            const message = selectedState && selectedDistrict 
                ? `Selected State: ${selectedState}, District: ${selectedDistrict}`
                : "Please select both a state and a district.";

            document.getElementById("selectedInfo").textContent = message;
        }

        window.onload = populateStates;
    </script>
</head>
<body>
    <form>
        <label for="state">State:</label>
        <select id="state" name="state" onchange="populateDistricts()">
            <option value="">Select State</option>
        </select>
        <br><br>

        <label for="district">District:</label>
        <select id="district" name="district" onchange="displaySelection()">
            <option value="">Select District</option>
        </select>
        <br><br>
    </form>

    <h1 id="selectedInfo"></h1>
</body>
</html>
